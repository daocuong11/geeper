name: Bug report / Reportar un error
description: Something doesn't work as expected / Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened? / ¿Qué pasó?
      description: What you did, what you expected and what you got. / Qué hiciste, qué esperabas y qué obtuviste.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`pnpm run doctor` output"
      render: text
  - type: input
    id: version
    attributes:
      label: Commit or version / Commit o versión
  - type: dropdown
    id: platform
    attributes:
      label: Platform / Plataforma
      options: [Linux, WSL2, Windows (desktop app), macOS, Other]
